name: check

# 커밋 전에 `npm run check` 를 돌리기로 정해 두었지만(§15.1) 사람이 기억해야 하는
# 규칙은 언젠가 잊힙니다. 푸시할 때마다 기계가 대신 확인합니다.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `xlsx` 는 SheetJS CDN 에서 받습니다(npm 레지스트리 판에는 미패치 취약점이
      # 있습니다 — §2). `npm ci` 가 그 주소를 그대로 씁니다.
      - run: npm ci

      # 타입 검사 + eslint + 회귀 세트 16종
      - run: npm run check

      # 빌드까지 확인합니다 — 타입이 통과해도 번들이 깨질 수 있습니다
      - run: npm run build
